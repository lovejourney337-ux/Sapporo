<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4EFE6">
<title>삿포로 · 2026.12.12–12.17</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Caveat:wght@500&display=swap">
<style>
:root{
  --paper:#F4EFE6; --sheet:#FBF7F0; --ink:#2B211C; --ink-2:#6B5B4F;
  --rule:#E3D8C7; --rule-2:#CDBFAA;
  --ai:#5E6E50; --ai-ink:#4E5C42; --ai-soft:#E7EADF; --on-ai:#FBF7F0;
  --kin:#D8BC74; --kin-soft:#F3E7C6; --kin-ink:#6B4F1D;
  --ver:#B8401F; --on-ver:#FBF7F0;
  --sage:#A9B59A; --butter:#EED9A0; --choc:#2B211C;
  --warn-soft:#F4DED4; --warn-ink:#8E3216;
  --note:#F6EBC8; --note-line:#E6D7A6; --tape:#A9B59A;
  --case:#E9D9BC; --case-rib:#DECCA9; --case-edge:#8C6E44;
  --red:#B8401F; --dot:rgba(43,33,28,.06); --mtn:#EAE1D1;
  --shadow:0 16px 30px rgba(120,95,70,.18);
  --shadow-s:0 6px 16px rgba(120,95,70,.12);
  --f:"IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif;
  --fd:"Hahmlet","IBM Plex Sans KR",serif;
  --fc:"Caveat",cursive;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#1D1713; --sheet:#272019; --ink:#F1E7DA; --ink-2:#C2B09E;
    --rule:#3B3028; --rule-2:#54453A;
    --ai:#B9C6A8; --ai-ink:#CAD5BB; --ai-soft:#2F3529; --on-ai:#1D1713;
    --kin:#D9C07E; --kin-soft:#3A3121; --kin-ink:#EED9A0;
    --ver:#DE7454; --on-ver:#1D1713; --sage:#7F8C70; --butter:#BFA86C; --choc:#F1E7DA;
    --warn-soft:#3B241A; --warn-ink:#F0B193; --note:#332B1D; --note-line:#43392A; --tape:#5E6B52;
    --case:#3A3024; --case-rib:#43382B; --case-edge:#BFA270; --red:#E27B5C;
    --dot:rgba(241,231,218,.05); --mtn:#2A231C;
    --shadow:0 16px 30px rgba(0,0,0,.35); --shadow-s:0 6px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#1D1713; --sheet:#272019; --ink:#F1E7DA; --ink-2:#C2B09E;
  --rule:#3B3028; --rule-2:#54453A;
  --ai:#B9C6A8; --ai-ink:#CAD5BB; --ai-soft:#2F3529; --on-ai:#1D1713;
  --kin:#D9C07E; --kin-soft:#3A3121; --kin-ink:#EED9A0;
  --ver:#DE7454; --on-ver:#1D1713; --sage:#7F8C70; --butter:#BFA86C; --choc:#F1E7DA;
  --warn-soft:#3B241A; --warn-ink:#F0B193; --note:#332B1D; --note-line:#43392A; --tape:#5E6B52;
  --case:#3A3024; --case-rib:#43382B; --case-edge:#BFA270; --red:#E27B5C;
  --dot:rgba(241,231,218,.05); --mtn:#2A231C;
  --shadow:0 16px 30px rgba(0,0,0,.35); --shadow-s:0 6px 16px rgba(0,0,0,.3);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55;
  background-color:var(--paper);
  background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);
  background-size:5px 5px;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0;text-align:inherit}
h1,h2,h3,h4{margin:0;font-family:var(--fd);font-weight:800;letter-spacing:-.02em;word-break:keep-all;overflow-wrap:break-word}
p{margin:0}
.place,.ticket-sub,.spt .nm,.spt .nt,.list .tx,.kv,.bitem .bn,.bitem .bm,.memo-line,.alt,.empty,.exp .nm2,.tile .lab,.th-top,.th-meta,.confirmcard h3,.fold .stitle{word-break:keep-all;overflow-wrap:break-word}
a{color:var(--ai-ink)}
svg{display:block}
.tnum{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.08em;font-weight:500;color:var(--ink-2);text-transform:uppercase}
.wrap{
  max-width:520px;margin:0 auto;
  padding-left:max(20px,env(safe-area-inset-left));
  padding-right:max(20px,env(safe-area-inset-right));
  padding-bottom:calc(110px + env(safe-area-inset-bottom));
}
.screen{display:none}
.screen.on{display:block}

/* ---------- (a) pill / buttons ---------- */
.pill{
  height:44px;padding:0 16px;border:1.5px solid var(--ink);border-radius:999px;
  background:var(--sheet);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;
  white-space:nowrap;
}
.btn{
  min-height:52px;border-radius:999px;font-weight:600;font-size:15px;padding:0 18px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn-ghost{border:1.5px solid var(--ink);background:var(--sheet);color:var(--ink)}
.btn-ver{background:var(--ver);color:var(--on-ver);flex:1}
.btn-choc{background:var(--choc);color:var(--paper);border-radius:12px;min-height:46px;font-size:14px;padding:0 14px;display:inline-flex;align-items:center;gap:6px}
.btn:disabled,.btn-ghost:disabled{opacity:.4}
button:focus-visible,summary:focus-visible,a:focus-visible,.input:focus-visible{outline:2px solid var(--ver);outline-offset:2px}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 6px}
.topbar .tl{min-width:0}
.topbar .tl .d{font-size:11px;letter-spacing:.1em;color:var(--ink-2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- (c) stamps nav ---------- */
.stamps{
  position:sticky;top:0;z-index:22;display:flex;overflow-x:auto;scrollbar-width:none;
  background:var(--paper);padding:10px 2px 10px;margin:0 -2px;
}
.stamps::-webkit-scrollbar{display:none}
.swrap{position:relative;flex:0 0 auto;padding-right:22px;display:flex;flex-direction:column;align-items:center;gap:6px}
.swrap:last-child{padding-right:0}
.swrap::after{content:"";position:absolute;right:1px;top:28px;width:20px;border-top:2px dotted var(--rule-2)}
.swrap:last-child::after{display:none}
.stamp{
  position:relative;width:56px;height:56px;border:2px solid var(--ink);border-radius:50%;
  background:var(--sheet);box-shadow:0 4px 0 var(--rule-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding-bottom:6px;
  transition:transform .22s ease-out,width .22s ease-out,height .22s ease-out,background .22s ease-out;
}
.stamp .d{font-family:var(--fd);font-weight:800;font-size:12px;line-height:1}
.stamp .p{font-size:9px;line-height:1.15;color:var(--ink-2);max-width:48px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stamp.on{background:var(--ver);border-color:var(--ver);color:var(--on-ver);transform:rotate(-6deg)}
.stamp.on .p{color:var(--on-ver);opacity:.85}
.stamp .nowtag{
  position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);
  background:var(--ver);color:var(--on-ver);font-size:9px;font-weight:700;letter-spacing:.04em;
  padding:1px 5px;border-radius:999px;border:1px solid var(--paper);
}
.sdate{font-size:11px;color:var(--ink-2);line-height:1.1}
.stamps.compact{padding:6px 2px}
.stamps.compact .stamp{width:44px;height:44px;transform:none}
.stamps.compact .stamp .p{display:none}
.stamps.compact .stamp.on{transform:rotate(-4deg)}
.stamps.compact .swrap{padding-right:14px;gap:0}
.stamps.compact .swrap::after{top:22px;width:12px}
.stamps.compact .sdate{display:none}
.stamps.compact .stamp .nowtag{bottom:-5px}

/* ---------- (d) ticket ---------- */
.ticket{background:var(--sheet);border-radius:16px;box-shadow:var(--shadow);margin:4px 0 22px}
.ticket-head{padding:16px 20px 20px;border-radius:16px 16px 0 0;color:#2B211C}
.ticket-head.odd{background:var(--sage)}
.ticket-head.even{background:var(--butter)}
.th-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;letter-spacing:.06em;font-weight:600}
.ticket-head h2{font-size:26px;line-height:1.2;margin:6px 0 6px;color:#2B211C}
.ticket-sub{font-size:13.5px;line-height:1.5;color:#2B211C;opacity:.88}
.th-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;font-size:11px;font-weight:700;letter-spacing:.04em}
.th-meta span{background:rgba(43,33,28,.12);padding:3px 9px;border-radius:999px}
.perf{position:relative;height:2px;border-top:2px dashed var(--rule-2);margin:0 22px}
.perf::before,.perf::after{content:"";position:absolute;top:-13px;width:22px;height:22px;border-radius:50%;background:var(--paper)}
.perf::before{left:-33px}
.perf::after{right:-33px}

/* timeline */
.timeline{padding:4px 20px 2px}
.trow{display:grid;grid-template-columns:64px 1fr}
.trow-time{padding:14px 12px 12px 0;text-align:right}
.tt{font-family:var(--fd);font-weight:700;font-size:15px;line-height:1.15}
.trow-time .tag{margin-top:6px;display:inline-block}
.trow-body{position:relative;padding:13px 0 15px 18px;border-left:1px solid var(--rule)}
.dot{position:absolute;left:-5px;top:19px;width:9px;height:9px;border-radius:50%;background:var(--sheet);border:2px solid var(--ink)}
.dot.stay{background:var(--kin)}
.dot.first{background:var(--ver);border-color:var(--ver)}
.place{font-weight:600;font-size:15.5px;line-height:1.4}
.move{font-size:13.5px;color:var(--ai-ink);margin-top:2px}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.rowmore{margin-top:6px}
.rowmore>summary{
  list-style:none;display:inline-flex;align-items:center;gap:5px;min-height:44px;
  font-size:12px;color:var(--ink-2);font-weight:600;padding-right:6px;
}
.rowmore>summary::-webkit-details-marker{display:none}
.rowmore>summary::after{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-1px);transition:transform .22s ease-out}
.rowmore[open]>summary::after{transform:rotate(-135deg) translateY(-1px)}
.memo-line{font-size:13px;color:var(--ink);margin-top:2px}
.phrase{margin-top:9px;padding:8px 11px;background:var(--ai-soft);border-radius:12px}
.phrase .jp{font-weight:600;font-size:14px;color:var(--ai-ink)}
.phrase .pron{font-size:12.5px;color:var(--ai-ink)}
.alt{font-size:12.5px;color:var(--warn-ink);margin-top:8px;line-height:1.5}
.alt b{font-weight:700}

/* hotel box in ticket */
.hotelbox{margin:6px 20px 18px;border:1.5px dashed var(--rule-2);border-radius:12px;padding:12px 14px}
.hotelbox .lbl{font-size:11px;letter-spacing:.08em;color:var(--ink-2);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hotelbox .nm{font-family:var(--fd);font-weight:700;font-size:16px;margin-top:3px}
.hotelbox .sub{font-size:12.5px;color:var(--ink-2);margin-top:3px}

/* ---------- (f) tags ---------- */
.tag{
  display:inline-block;font-size:11px;letter-spacing:.08em;border:1.5px solid var(--ink);
  border-radius:4px;padding:1px 5px;line-height:1.5;font-weight:600;
}
.tag.eat{border-color:var(--ver);color:var(--ver)}
.tag.stay{background:var(--butter);border-color:var(--butter);color:#2B211C}
.tag.see{background:var(--sage);border-color:var(--sage);color:#2B211C}
.tag.move{background:var(--choc);border-color:var(--choc);color:var(--paper)}

/* ---------- (g) badges ---------- */
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;line-height:1.5;letter-spacing:.02em}
.badge.pass,.badge.ticket{background:var(--ai);color:var(--on-ai)}
.badge.ic{border:1.5px solid var(--ai);color:var(--ai-ink)}
.badge.cash{background:var(--warn-soft);color:var(--warn-ink)}
.badge.card{border:1px solid var(--rule-2);color:var(--ink-2)}
.badge.free{background:var(--kin-soft);color:var(--kin-ink)}
.badge.closed{border:1px dashed var(--rule-2);color:var(--ink-2)}
.badge.unv{background:var(--warn-soft);color:var(--warn-ink)}
.badge.done{background:var(--ai-soft);color:var(--ai-ink)}
.badge.res{border:1.5px solid var(--ai);color:var(--ai-ink)}
.badge.warn{background:var(--warn-soft);color:var(--warn-ink)}

/* ---------- (h) foldable card ---------- */
.fold{background:var(--sheet);border-radius:16px;border:1px solid var(--rule);box-shadow:var(--shadow-s)}
.fold>summary{
  list-style:none;min-height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;cursor:pointer;
}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary .chev{margin-left:auto;width:8px;height:8px;border-right:1.5px solid var(--ink-2);border-bottom:1.5px solid var(--ink-2);transform:rotate(45deg) translateY(-2px);transition:transform .22s ease-out}
.fold[open]>summary .chev{transform:rotate(-135deg) translateY(-2px)}
.fold .fbody{padding:0 16px 16px;border-top:1px solid var(--rule);margin-top:0}
.fold>summary .stitle{font-family:var(--fd);font-weight:700;font-size:16px}

/* ---------- spots ---------- */
.dayhead{margin:2px 0 12px}
.dayhead .k{font-size:11px;letter-spacing:.1em;color:var(--ink-2);font-weight:600}
.dayhead h2{font-size:22px;margin-top:2px}
.grp{margin-bottom:20px}
.grp h3{font-size:12px;letter-spacing:.1em;color:var(--ink-2);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.grp h3::after{content:"";flex:1;border-top:1px solid var(--rule)}
.spt{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:11px 13px;margin-bottom:8px}
.spt .top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.spt .nm{font-weight:600;font-size:15px;line-height:1.35}
.spt .bd{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;justify-content:flex-end}
.spt .nt{font-size:12.5px;color:var(--ink-2);margin-top:5px;line-height:1.45}
.empty{background:var(--sheet);border:1px dashed var(--rule-2);border-radius:12px;padding:16px;font-size:13px;color:var(--ink-2);text-align:center}

/* ---------- (b)(i)-(k) home ---------- */
.postcard{
  position:relative;background:var(--sheet);padding:10px 10px 16px;border-radius:6px;
  transform:rotate(-1.2deg);box-shadow:var(--shadow);margin:18px 0 22px;
}
.tape{
  position:absolute;top:-13px;left:50%;transform:translateX(-50%) rotate(-4deg);
  width:100px;height:26px;opacity:.85;
  background:repeating-linear-gradient(115deg,var(--sage) 0 7px,rgba(255,255,255,.35) 7px 13px);
}
.photo{position:relative;height:clamp(240px,calc(100svh - 470px),420px);background:var(--mtn);border-radius:3px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block;filter:contrast(.94) saturate(.85) sepia(.08)}
.photo .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink-2)}
.postmark{position:absolute;top:14px;right:12px;width:64px;height:64px;opacity:.55}
.photobtn{
  position:absolute;right:10px;bottom:10px;height:38px;padding:0 14px;border-radius:999px;
  background:rgba(251,247,240,.82);color:#2B211C;font-size:12.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(43,33,28,.15);cursor:pointer;
}
.caption{padding:14px 8px 0}
.hand{font-family:var(--fc);font-size:30px;color:var(--ver);transform:rotate(-3deg);line-height:1.1;display:inline-block}
.caption h1{font-size:30px;margin-top:2px}
.capdiv{border-top:1.5px dashed var(--rule-2);margin:10px 0 10px}
.caprow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.dday{background:var(--butter);color:#2B211C;font-size:13px;font-weight:700;border-radius:999px;padding:4px 11px;letter-spacing:.02em}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.tile{border-radius:16px;padding:13px 14px;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;border:none;text-align:left;transition:box-shadow .18s ease-out}
.tile.todo{background:var(--sage);color:#2B211C}
.tile.pack{background:var(--butter);color:#2B211C}
.tile.on{box-shadow:0 0 0 2px var(--ink)}
.tile .lab{font-size:12px;font-weight:600;letter-spacing:.04em}
.tile .num{font-family:var(--fd);font-weight:800;font-size:30px;line-height:1}
.tile .num small{font-size:15px;font-weight:700;opacity:.7}
.pbar{height:6px;border-radius:999px;background:rgba(43,33,28,.22);overflow:hidden}
.pbar i{display:block;height:100%;background:#2B211C}
.tile .more{font-size:11px;font-weight:600;opacity:.75}

.memo{
  position:relative;background:var(--note);border-radius:12px;padding:22px 14px 14px;
  transform:rotate(-.35deg);box-shadow:var(--shadow-s);
  background-image:repeating-linear-gradient(to bottom,transparent 0 27px,var(--note-line) 27px 28px);
  background-position:0 22px;
}
.memo::before{
  content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(-2deg);
  width:74px;height:20px;background:var(--tape);opacity:.9;
}
.memo h3{font-size:17px;font-weight:700;margin-bottom:6px;color:var(--ink)}
.case{
  position:relative;background:var(--case);border:2px solid var(--case-edge);border-radius:22px;
  padding:16px 14px 22px;margin-top:16px;
  background-image:repeating-linear-gradient(to right,transparent 0 46px,var(--case-rib) 46px 48px);
}
.case::before{content:"";position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:96px;height:30px;border:6px solid var(--case-edge);border-bottom:none;border-radius:12px 12px 0 0}
.case .wheel{position:absolute;bottom:-11px;width:20px;height:20px;border-radius:50%;background:var(--case-edge)}
.case .wheel.w1{left:26px}
.case .wheel.w2{right:26px}
.case .inner{position:relative;background:var(--sheet);border:1px dashed var(--rule-2);border-radius:12px;padding:10px 12px 12px}
.casetag{
  position:absolute;top:-10px;right:8px;transform:rotate(6deg);background:var(--sheet);border:1px solid var(--case-edge);
  border-radius:6px;padding:2px 8px;font-size:10px;font-weight:700;line-height:1.4;color:var(--ink);z-index:2;text-align:center;
}
.case h3{font-size:17px;font-weight:700;margin-bottom:4px;color:var(--ink)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:flex-start;gap:9px;border-bottom:1px solid rgba(43,33,28,.08);min-height:44px}
.list li:last-child{border-bottom:none}
.chk{
  flex:0 0 auto;width:22px;height:22px;margin-top:11px;border:1.5px solid var(--ink-2);border-radius:5px;
  background:transparent;display:flex;align-items:center;justify-content:center;
}
.chk svg{width:14px;height:14px;stroke:var(--on-ai);stroke-width:2.2;fill:none;opacity:0}
.chk.on{background:var(--ai);border-color:var(--ai)}
.chk.on svg{opacity:1}
.list .tx{flex:1;padding:10px 0 10px;font-size:14px;line-height:1.45;word-break:break-word}
.list .tx.done{color:var(--ink-2);text-decoration:line-through}
.list .del{flex:0 0 auto;width:32px;height:32px;margin-top:6px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);border-radius:50%}
.list .del svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.6;fill:none}
.list.pack .chk.on{background:var(--red);border-color:var(--red)}
.list.pack .tx.done{color:var(--red);text-decoration:line-through}
.addrow{display:flex;gap:8px;margin-top:10px;align-items:center}
.addrow .input{min-height:44px;font-size:16px;flex:1}
.addbtn{width:44px;height:44px;flex:0 0 auto;border-radius:12px;background:var(--choc);color:var(--paper);display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1}

/* ---------- (l) tabbar ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  height:calc(72px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:var(--sheet);border-top:1px solid var(--rule);box-shadow:0 -8px 20px rgba(120,95,70,.10);
}
.tabbar .tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--ink-2);min-height:44px}

    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function pad2(n){ return (n<10?"0":"")+n; }
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function won(n){ return Math.round(n).toLocaleString("ko-KR")+"원"; }
function num(n){ return Math.round(n).toLocaleString("ko-KR"); }
function jpy(n){ return "¥"+num(n); }
function dayById(id){ for(var i=0;i<DAYS.length;i++){ if(DAYS[i].id===id) return DAYS[i]; } return DAYS[0]; }
function dateLabel(d){ return d.date.slice(5).replace("-","."); }

function ddayChip(){
  var t=todayISO(), s=state.trip.start, e=state.trip.end;
  try{
    if(t<s){ var n=Math.round((new Date(s+"T00:00:00")-new Date(t+"T00:00:00"))/864e5); return "D-"+n; }
    if(t===s) return "D-DAY";
    if(t<=e){ var k=Math.round((new Date(t+"T00:00:00")-new Date(s+"T00:00:00"))/864e5)+1; return "여행 "+k+"일째"; }
  }catch(err){ return "여행"; }
  return "여행 끝";
}
function tripOngoing(){
  var t=todayISO(); return t>=state.trip.start && t<=state.trip.end;
}

/* ================= 상태 ================= */
var DEFAULT_STATE = {
  screen:"main", tab:"schedule", day:1, openTile:"", editStep:1,
  trip: TRIP,
  todo: TODO_DEFAULT.map(function(t,i){ return {id:"t"+i, text:t, done:false}; }),
  pack: PACK_DEFAULT.map(function(t,i){ return {id:"p"+i, text:t, done:false}; }),
  expenses: [],
  lastPay: { cur:"JPY", pay:"현금" }
};
var state = (function(){
  var s = JSON.parse(JSON.stringify(DEFAULT_STATE));
  var raw = store.get(LS_KEY);
  if(raw){
    try{
      var o = JSON.parse(raw);
      if(o && typeof o==="object"){
        for(var k in o){
          if(!Object.prototype.hasOwnProperty.call(o,k)) continue;
          if(k==="trip" && o.trip && typeof o.trip==="object"){
            for(var tk in o.trip){ if(Object.prototype.hasOwnProperty.call(o.trip,tk)) s.trip[tk]=o.trip[tk]; }
          } else if(k==="todo"||k==="pack"||k==="expenses"){
            if(Object.prototype.toString.call(o[k])==="[object Array]") s[k]=o[k];
          } else if(k==="lastPay" && o.lastPay && typeof o.lastPay==="object"){
            s.lastPay={cur:o.lastPay.cur||"JPY", pay:o.lastPay.pay||"현금"};
          } else if(typeof o[k]!=="object"){ s[k]=o[k]; }
        }
      }
    }catch(e){ stateSaveSafe=false; }
  }
  if(!s.trip || typeof s.trip!=="object") s.trip = TRIP;
  if(!Array.isArray(s.todo)) s.todo = DEFAULT_STATE.todo.map(function(x){return Object.assign({},x);});
  if(!Array.isArray(s.pack)) s.pack = DEFAULT_STATE.pack.map(function(x){return Object.assign({},x);});
  if(!Array.isArray(s.expenses)) s.expenses = [];
  if(typeof s.day!=="number" || s.day<1 || s.day>DAYS.length) s.day=1;
  return s;
})();
var stateSaveSafe = true;

function save(){ stateSaveSafe = store.set(LS_KEY, JSON.stringify(state)); }
function getPhoto(){ return store.get(PHOTO_KEY) || ""; }

var toastTimer=null;
function toast(msg){
  var el=document.getElementById("toast");
  el.textContent=msg; el.classList.add("on");
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ el.classList.remove("on"); }, 1800);
}

/* ================= 공통 조각 ================= */
function stampsHTML(sel){
  var t=todayISO();
  return DAYS.map(function(d){
    var on = d.id===sel;
    return '<div class="swrap">'
      +'<button class="stamp'+(on?" on":"")+'" data-act="day" data-day="'+d.id+'" aria-pressed="'+(on?"true":"false")+'" aria-label="'+esc(d.abbr+" "+d.place+" "+dateLabel(d))+'">'
      +'<span class="d">'+d.abbr+'</span><span class="p">'+esc(d.place)+'</span>'
      +(d.date===t?'<span class="nowtag">오늘</span>':'')
      +'</button>'
      +'<span class="sdate tnum">'+dateLabel(d)+' '+WD[d.wd]+'</span>'
      +'</div>';
  }).join("");
}

var PAY_LABEL = { pass:"패스", ticket:"티켓", ic:"교통카드", cash:"현금", card:"카드" };
var KIND_LABEL = { eat:"먹기", stay:"숙소", see:"관광", move:"이동" };

function payBadge(p){ return p ? '<span class="badge '+p+'">'+PAY_LABEL[p]+'</span>' : ""; }

function rowHTML(r, idx, day){
  var dot = r.k==="stay" ? "stay" : "";
  if(idx===0 && day.date===todayISO()) dot="first";
  var badges = payBadge(r.pay) + (r.unv?'<span class="badge unv">미검증</span>':"");
  var inner = "";
  if(r.note) inner += '<div class="memo-line">'+esc(r.note)+'</div>';
  if(r.phrase) inner += '<div class="phrase"><div class="jp">'+esc(r.phrase)+'</div><div class="pron">'+esc(r.pron)+'</div></div>';
  if(r.alt) inner += '<div class="alt"><b>놓치면</b> '+esc(r.alt)+'</div>';
  var more = inner ? '<details class="rowmore"><summary>자세히</summary>'+inner+'</details>' : "";
  return '<div class="trow">'
    +'<div class="trow-time"><div class="tt tnum">'+esc(r.t)+'</div><span class="tag '+r.k+'">'+KIND_LABEL[r.k]+'</span></div>'
    +'<div class="trow-body"><span class="dot '+dot+'"></span>'
    +'<div class="place">'+esc(r.place)+'</div>'
    +(r.move?'<div class="move">'+esc(r.move)+'</div>':"")
    +(badges?'<div class="badges">'+badges+'</div>':"")
    +more
    +'</div></div>';
}

function hotelLine(day){
  if(day.id===1) return "첫날 밤 묵는 곳";
  if(day.id===DAYS.length) return "체크아웃하는 날 · 짐 안내";
  return day.id+"일차 밤 묵는 곳";
}

function hotelStatus(day){
  if(day.id===DAYS.length) return '<span class="badge closed">체크아웃</span>';
  return '<span class="badge unv">미검증</span>';
}

/* ================= 일정 탭 ================= */
function scheduleHTML(){
  var day = dayById(state.day);
  var unv = day.rows.filter(function(r){ return r.unv; }).length;
  var first = day.rows[0], last = day.rows[day.rows.length-1];
  var range = first.t + " – " + last.t;

  var head = '<div class="ticket-head '+(day.id%2?"odd":"even")+'">'
    +'<div class="th-top"><span>'+day.abbr+' · '+day.date+" "+WD[day.wd]+'</span><span>'+day.wd+'</span></div>'
    +'<h2>'+esc(day.title)+'</h2>'
    +'<div class="ticket-sub">'+esc(day.sub)+'</div>'
    +'<div class="th-meta"><span class="tnum">'+esc(range)+'</span><span>'+day.rows.length+'곳 · 미검증 '+unv+'건</span></div>'
    +'</div>';

  var body = '<div class="timeline">'
    + day.rows.map(function(r,i){ return rowHTML(r,i,day); }).join("")
    +'</div>';

  var hotel = '<div class="hotelbox"><div class="lbl"><span>오늘 밤</span>'+hotelStatus(day)+'</div>'
    +'<div class="nm">'+esc(HOTEL.name)+'</div>'
    +'<div class="sub">'+esc(hotelLine(day))+' · 체크인 '+HOTEL.checkin+' / 체크아웃 '+HOTEL.checkout+'</div>'
    +'</div>';

  var confirmCard = "";
  if(!state.trip.confirmed){
    confirmCard = '<div class="confirmcard"><div class="ch">'
      +'<svg class="st" viewBox="0 0 24 24" fill="none" stroke="#B8401F" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></svg>'
      +'<div><h3>최신 정보로 확정하기</h3><div style="font-size:12.5px;color:var(--ink-2);margin-top:3px">입력한 여행 정보를 복사해 보내면 일정을 확정해 드려요.</div></div>'
      +'</div><div class="sum" id="summaryBox">'+esc(summaryText())+'</div>'
      +'<button class="btn-choc" data-act="copy-summary">요약 복사</button></div>';
  }

  return '<div class="panel">'
    +'<div class="stamps" id="stamps">'+stampsHTML(day.id)+'</div>'
    + confirmCard
    +'<div class="ticket">'+head+'<div class="perf"></div>'+body+hotel+'</div>'
    +'</div>';
}

function summaryText(){
  var t=state.trip;
  return "여행지: "+t.dest+" · "+t.start+"~"+t.end+" · "+t.people+"명 · "+t.airport+" 출발\n"
    +"항공: "+(t.flight||"미입력")+"\n숙소: "+(t.hotel||"미입력")+" ("+(t.meals||"-")+")\n"
    +"티켓·패스: "+(t.pass||"없음")+"\n꼭 하고 싶은 것: "+(t.want||"-")+"\n피하고 싶은 것: "+((t.avoid||[]).join(", ")||"-");
}

/* ================= 맛집·관광 탭 ================= */
function spotItem(s){
  var bd = "";
  if(s.reserve) bd += '<span class="badge res">예약 '+esc(s.reserve)+'</span>';
  if(s.cash) bd += '<span class="badge cash">현금만</span>';
  if(s.closed) bd += '<span class="badge closed">'+esc(s.closed)+'</span>';
  if(s.unv) bd += '<span class="badge unv">미검증</span>';
  return '<div class="spt"><div class="top"><div class="nm">'+esc(s.n)+'</div>'
    +(bd?'<div class="bd">'+bd+'</div>':"")
    +'</div><div class="nt"><span class="tag see" style="margin-right:5px">'+esc(s.tag)+'</span>'+esc(s.note)+'</div></div>';
}

function spotsHTML(){
  var day=dayById(state.day);
  var eat = day.eat||[], see = day.see||[];
  var body = '<div class="dayhead"><div class="k">DAY '+day.id+' · '+day.date+" "+WD[day.wd]+'</div><h2>'+esc(day.place)+'</h2></div>';
  body += '<div class="grp"><h3>먹을 곳</h3>' + (eat.length?eat.map(spotItem).join(""):
    '<div class="empty">이날 먹을 곳 목록이 비어 있어요</div>') + '</div>';
  body += '<div class="grp"><h3>볼 곳</h3>' + (see.length?see.map(spotItem).join(""):
    '<div class="empty">이날 볼 곳 목록이 비어 있어요</div>') + '</div>';
  return '<div class="panel"><div class="stamps" id="stamps">'+stampsHTML(day.id)+'</div>'+body+'</div>';
}

/* ================= 숙소 탭 ================= */
function lodgingHTML(){
  var day=dayById(state.day);
  var extra = day.id===DAYS.length
    ? "09:00 체크아웃 — 짐은 바로 공항으로. JR 09:00 출발(09:40 신치토세 도착)."
    : "6일 내내 같은 숙소 — 짐 풀고 다니는 일정. 오도리·소세이가와 지하보도로 이동.";
  var card = '<div class="stamps" id="stamps">'+stampsHTML(day.id)+'</div>'
    +'<div class="dayhead"><div class="k">DAY '+day.id+' · '+day.date+" "+WD[day.wd]+'</div><h2>'+esc(hotelLine(day))+'</h2>'
    +'<div style="font-size:12.5px;color:var(--ink-2);margin-top:4px">'+esc(extra)+'</div></div>'
    +'<details class="fold" open><summary><span class="stitle">'+esc(HOTEL.name)+'</span>'+hotelStatus(day)+'<span class="chev"></span></summary>'
    +'<div class="fbody">'
    +'<div class="kv"><span class="k2">체크인</span><span>'+HOTEL.checkin+'</span></div>'
    +'<div class="kv"><span class="k2">체크아웃</span><span>'+(day.id===DAYS.length?"09:00 (정규 11:00)":HOTEL.checkout)+'</span></div>'
    +'<div class="kv"><span class="k2">송영</span><span>없음 — 삿포로역 도보 7분 / 오도리 도보 5분</span></div>'
    +'<div class="kv"><span class="k2">식사</span><span>조식 미포함(1F 유료) · 12/14 다이마루 B1 키노토야</span></div>'
    +'<div class="kv" style="display:block"><span class="k2">메모</span><div style="font-size:13.5px;margin-top:2px">예약 확인서로 체크인 시간·조식 요금 재확인. 체크인 전·체크아웃 후 짐 보관은 프런트에 요청. 12/17은 공항에 일찍 가야 해서 짐을 맡기지 않습니다.</div></div>'
    +'<div style="margin-top:12px"><a class="btn-choc" href="'+HOTEL.map+'" target="_blank" rel="noopener">지도에서 보기</a></div>'
    +'</div></details>'
    +'<div style="font-size:12px;color:var(--ink-2);margin-top:12px">숙소 상태는 예약 확인서를 받기 전까지 <b style="color:var(--warn-ink)">미검증</b>으로 표시합니다.</div>';
  return '<div class="panel">'+card+'</div>';
}
</script>
<script>
"use strict";
/* ================= 홈 탭 ================= */
function postmarkSVG(cls){
  return '<svg class="'+cls+'" viewBox="0 0 64 64" fill="none" stroke="var(--ink-2)" stroke-width="1.3" aria-hidden="true">'
    +'<circle cx="34" cy="32" r="20"/><circle cx="34" cy="32" r="15"/>'
    +'<path d="M6 24h14M6 32h18M6 40h14"/><path d="M28 27h12M28 32h12M28 37h8"/></svg>';
}
function nights(){
  try{ return Math.max(1, Math.round((new Date(state.trip.end+"T00:00:00")-new Date(state.trip.start+"T00:00:00"))/864e5)); }
  catch(e){ return 5; }
}
function tileHTML(kind,label,list,open){
  var total=list.length, done=list.filter(function(x){return x.done;}).length;
  var pct= total? Math.round(done/total*100):0;
  return '<button class="tile '+kind+(open?" on":"")+'" data-act="toggle-tile" data-tile="'+kind+'" aria-expanded="'+(open?"true":"false")+'">'
    +'<div class="lab">'+label+'</div>'
    +'<div><div class="num tnum">'+done+'<small>/'+total+'</small></div>'
    +'<div class="pbar" style="margin-top:7px"><i style="width:'+pct+'%"></i></div></div>'
    +'<div class="more">'+(open?"· 접기":"· 펼치기")+'</div>'
    +'</button>';
}
function listHTML(kind,list){
  var items=list.map(function(it){
    return '<li>'
      +'<button class="chk'+(it.done?" on":"")+'" data-act="'+kind+'-check" data-id="'+esc(it.id)+'" aria-pressed="'+(it.done?"true":"false")+'" aria-label="체크: '+esc(it.text)+'">'
      +'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg></button>'
      +'<div class="tx'+(it.done?" done":"")+'">'+esc(it.text)+'</div>'
      +'<button class="del" data-act="'+kind+'-del" data-id="'+esc(it.id)+'" aria-label="삭제: '+esc(it.text)+'">'
      +'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>'
      +'</li>';
  }).join("");
  return '<ul class="list '+(kind==="pack"?"pack":"")+'">'+items+'</ul>'
    +'<div class="addrow"><input class="input" id="add_'+kind+'" type="text" placeholder="항목 추가" aria-label="'+ (kind==="pack"?"준비물":"할 일") +' 항목 추가">'
    +'<button class="addbtn" data-act="'+kind+'-add" aria-label="추가">+</button></div>';
}
function caseHTML(){
  var list=state.pack, done=list.filter(function(x){return x.done;}).length;
  return '<div class="case"><div class="casetag">준비물<br><span class="tnum">'+done+'/'+list.length+'</span></div>'
    +'<span class="wheel w1"></span><span class="wheel w2"></span>'
    +'<div class="inner"><h3>준비물 · 캐리어</h3>'+listHTML("pack",list)+'</div></div>';
}
function homeHTML(){
  var photo=getPhoto();
  var img = photo ? '<img src="'+esc(photo)+'" alt="엽서 사진">' : "";
  var ph = photo ? '' : '<div class="ph"><div style="font-size:12.5px">사진을 넣으면 엽서가 완성돼요</div></div>';
  var dates = state.trip.start.slice(5).replace("-",".")+" – "+state.trip.end.slice(5).replace("-",".");
  var postcard = '<div class="postcard"><span class="tape"></span>'
    +'<div class="photo">'+img+ph+postmarkSVG("postmark")
    +'<label class="photobtn">'+(photo?"사진 바꾸기":"사진 고르기")
    +'<input type="file" accept="image/*" id="photoInput" style="display:none"></label>'
    +'</div>'
    +'<div class="caption">'
    +'<div class="hand">'+esc(state.trip.destEn||"SAPPORO")+'</div>'
    +'<h1>'+esc(state.trip.dest)+' '+nights()+'박 '+(nights()+1)+'일</h1>'
    +'<div class="capdiv"></div>'
    +'<div class="caprow"><span class="tnum">'+esc(dates)+'</span><span>·</span><span>'+state.trip.people+'명</span>'
    +'<span class="dday">'+esc(ddayChip())+'</span></div>'
    +'</div></div>';
  var todo=listHTML("todo",state.todo), pack=caseHTML();
  var body = postcard
    +'<div class="tiles">'+tileHTML("todo","할 일",state.todo,state.openTile==="todo")+tileHTML("pack","준비물",state.pack,state.openTile==="pack")+'</div>';
  if(state.openTile==="todo"){
    var d=state.todo.filter(function(x){return x.done;}).length;
    body += '<div class="memo"><h3>할 일 <span style="font-size:12px;font-weight:600;color:var(--ink-2)">'+d+'/'+state.todo.length+'</span></h3>'+listHTML("todo",state.todo)+'</div>';
  } else if(state.openTile==="pack"){
    body += pack;
  }
  return '<div class="panel">'+body+'</div>';
}

/* ================= 가계부 ================= */
function toKRW(it){ return it.cur==="JPY" ? yen2krw(it.amt) : it.amt; }
function expKRW(e){ return e.cur==="JPY" ? yen2krw(e.amount) : e.amount; }
function budgetByCat(){
  var o={};
  BUDGET.forEach(function(i){ o[i.cat]=(o[i.cat]||0)+toKRW(i); });
  return o;
}
function spentByCat(){
  var o={};
  state.expenses.forEach(function(e){
    var c=EXP_MAP[e.cat]||"기타";
    o[c]=(o[c]||0)+expKRW(e);
  });
  return o;
}
function getExp(id){
  for(var i=0;i<state.expenses.length;i++){ if(state.expenses[i].id===id) return state.expenses[i]; }
  return null;
}
function ledgerHTML(){
  var bcat=budgetByCat(), scat=spentByCat();
  var budgetTotal=0; BUDGET.forEach(function(i){ budgetTotal+=toKRW(i); });
  var spentTotal=0; state.expenses.forEach(function(e){ spentTotal+=expKRW(e); });
  var people=Math.max(1,state.trip.people||1);
  var left=budgetTotal-spentTotal;
  var over = left<0;

  var tiles='<div class="btiles">'
    +'<div class="btile"><div class="lab">예산 합계</div><div class="v tnum">'+won(budgetTotal)+'</div><div class="s tnum">1인 '+won(budgetTotal/people)+'</div></div>'
    +'<div class="btile'+(over?" over":"")+'"><div class="lab">'+(over?"예산 초과":"남은 예산")+'</div><div class="v tnum">'+won(Math.abs(left))+'</div>'
    +'<div class="s tnum">지출 '+won(spentTotal)+'</div></div>'
    +'</div>';

  var rows="";
  BCATS.forEach(function(c){
    var b=bcat[c]||0, s=scat[c]||0;
    if(b===0 && s===0) return;
    var pct= b>0 ? Math.min(100, Math.round(s/b*100)) : (s>0?100:0);
    var isOver = s>b;
    rows += '<tr><td><div class="catn">'+c+'</div>'
      +'<div class="bar"><i class="'+(isOver?"over":"")+'" style="width:'+pct+'%"></i></div></td>'
      +'<td class="r num tnum">'+won(b)+'</td>'
      +'<td class="r num tnum" '+(isOver?'style="color:var(--warn-ink)"':'')+'>'+won(s)+'</td></tr>';
  });
  var table='<table class="btable"><thead><tr><th>분류</th><th class="r">예산</th><th class="r">지출</th></tr></thead><tbody>'+rows+'</tbody></table>';

  var kConf=BUDGET.filter(function(i){return i.basis==="확인";}).length;
  var kEst=BUDGET.length-kConf;
  var items = BUDGET.map(function(i){
    var amt = i.cur==="JPY" ? jpy(i.amt)+' · '+won(yen2krw(i.amt)) : won(i.amt);
    return '<div class="bitem"><div class="l"><div class="bn">'+esc(i.name)+'</div>'
      +'<div class="bm">'+esc(i.memo)+'</div></div>'
      +'<div class="br"><div class="ba tnum">'+amt+'</div>'
      +'<span class="badge '+(i.basis==="확인"?"done":"unv")+'">'+esc(i.basis)+'</span></div></div>';
  }).join("");
  var budgetFold='<details class="fold"><summary><span class="stitle">예산 항목</span>'
    +'<span class="badge card">'+BUDGET.length+'개 · 확인 '+kConf+' · 추정 '+kEst+'</span><span class="chev"></span></summary>'
    +'<div class="fbody">'+items+'</div></details>';

  var fx='<div class="fxline">원 환산 · 100엔 = '+FX.jpy100+'원 ('+esc(FX.date)+' 고시 · 한국수출입은행 매매기준율)</div>'
    +'<div class="fxbox"><div class="r"><span>엔</span><input id="fxin" inputmode="numeric" placeholder="3980" aria-label="엔화 금액"><span>→</span><span class="eq tnum" id="fxout">0원</span></div>'
    +'<div style="font-size:11px;color:var(--ai-ink);margin-top:6px">카드·환전은 수수료가 붙어 이 값보다 조금 더 듭니다.</div></div>';

  /* 실제 지출 */
  var expBlock="";
  if(state.expenses.length===0){
    expBlock='<div class="empty" style="text-align:left;line-height:1.6">오른쪽 아래 <b>지출</b> 버튼으로 기록하거나, 영수증 사진을 채팅에 올리면 대신 넣어 드려요.</div>';
  } else {
    var jpySum=0, krwSum=0;
    state.expenses.forEach(function(e){ if(e.cur==="JPY") jpySum+=e.amount; else krwSum+=e.amount; });
    var others=state.expenses.filter(function(e){ return e.cur!=="JPY" && e.cur!=="KRW"; }).length;
    expBlock += '<div class="curtot"><span>JPY 합계</span><span class="n tnum">'+jpy(jpySum)+' <span style="color:var(--ink-2);font-weight:400">('+won(yen2krw(jpySum))+')</span></span></div>';
    if(krwSum>0) expBlock += '<div class="curtot"><span>KRW 합계</span><span class="n tnum">'+won(krwSum)+'</span></div>';
    expBlock += '<div class="curtot"><span>합계 · 1인</span><span class="n tnum">'+won(spentTotal)+' · '+won(spentTotal/people)+'</span></div>';
    if(others>0) expBlock += '<div style="font-size:12px;color:var(--warn-ink);margin-top:6px">원화·엔화가 아닌 '+others+'건은 합계에서 빠졌어요.</div>';

    /* 분류 × 통화 */
    var catCur={};
    state.expenses.forEach(function(e){
      catCur[e.cat]=catCur[e.cat]||{JPY:0,KRW:0};
      catCur[e.cat][e.cur]=(catCur[e.cat][e.cur]||0)+e.amount;
    });
    var crow='';
    EXP_CATS.forEach(function(c){
      var x=catCur[c]; if(!x) return;
      crow+='<tr><td>'+c+'</td><td class="r num tnum">'+(x.JPY?jpy(x.JPY):"—")+'</td><td class="r num tnum">'+(x.KRW?won(x.KRW):"—")+'</td></tr>';
    });
    expBlock += '<div class="span">분류 × 통화</div><table class="btable"><thead><tr><th>분류</th><th class="r">JPY</th><th class="r">KRW</th></tr></thead><tbody>'+crow+'</tbody></table>';

    /* 날짜별 */
    expBlock += '<div class="span">날짜별</div>';
    DAYS.forEach(function(d){
      var list=state.expenses.filter(function(e){ return e.day===d.id; });
      if(!list.length) return;
      var daySum={JPY:0,KRW:0};
      list.forEach(function(e){ daySum[e.cur]=(daySum[e.cur]||0)+e.amount; });
      var sumTxt=[];
      if(daySum.JPY) sumTxt.push(jpy(daySum.JPY));
      if(daySum.KRW) sumTxt.push(won(daySum.KRW));
      expBlock += '<div class="expgrp"><div class="gh"><span>'+d.abbr+' · '+dateLabel(d)+' '+WD[d.wd]+'</span><span class="tnum">'+sumTxt.join(" · ")+'</span></div>'
        + list.map(function(e){
            var pending = state.pendingDel===e.id;
            return '<div class="exp"><div class="l"><div class="nm2">'+esc(e.note||"지출")+'</div>'
              +'<div class="meta"><span class="tag see">'+esc(e.cat)+'</span>'+payBadge(e.pay==="현금"?"cash":e.pay==="카드"?"card":"ic")
              +'</div></div>'
              +'<div class="amt tnum">'+(e.cur==="JPY"?jpy(e.amount):won(e.amount))+'</div>'
              +'<div class="ops"><button class="tbtn" data-act="exp-edit" data-id="'+esc(e.id)+'">수정</button>'
              +'<button class="tbtn '+(pending?"danger":"")+'" data-act="exp-del" data-id="'+esc(e.id)+'">'+(pending?"한 번 더":"삭제")+'</button></div>'
              +'</div>';
          }).join("")
        +'</div>';
    });
  }

  return '<div class="panel">'
    +'<div style="padding:8px 0 12px"><div class="eyebrow">LEDGER · 2인</div>'
    +'<h2 style="font-size:22px;margin-top:2px">가계부</h2></div>'
    +tiles+table+fx+ '<div style="height:14px"></div>'+budgetFold
    +'<div class="span">실제 지출</div>'+expBlock
    +'</div>';
}

/* ================= 지출 시트 ================= */
var draft = { cur:"JPY", amt:"", cat:"식비", pay:"현금", day:1, note:"", editId:null };
function openSheet(editId){
  document.getElementById("sheetwrap").classList.add("open");
  if(editId){
    var e=getExp(editId);
    if(e) draft={cur:e.cur, amt:String(e.amount), cat:e.cat, pay:e.pay, day:e.day, note:e.note||"", editId:e.id};
  } else {
    draft={cur:state.lastPay.cur||"JPY", amt:"", cat:"식비", pay:state.lastPay.pay||"현금", day:state.day, note:"", editId:null};
  }
  renderSheet();
  setTimeout(function(){
    var a=document.getElementById("amtInput");
    if(a) a.focus();
  },80);
}
function closeSheet(){
  document.getElementById("sheetwrap").classList.remove("open");
  draft.editId=null;
}
function renderSheet(){
  var el=document.getElementById("sheet");
  var curSym = draft.cur==="JPY" ? "¥" : "₩";
  var dayChips = DAYS.map(function(d){
    return '<button class="chip sm'+(draft.day===d.id?" on":"")+'" data-act="sheet-day" data-v="'+d.id+'">'+d.abbr+' <span style="opacity:.7">'+dateLabel(d)+'</span></button>';
  }).join("");
  el.innerHTML =
    '<div class="shead"><h3>'+(draft.editId?"지출 수정":"지출 기록")+'</h3>'
    +'<button class="xbtn" data-act="quick-close" aria-label="닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>'
    +'<div class="flabel">통화</div><div class="chiprow">'
    +'<button class="chip sm'+(draft.cur==="JPY"?" on":"")+'" data-act="sheet-cur" data-v="JPY">엔 (JPY)</button>'
    +'<button class="chip sm'+(draft.cur==="KRW"?" on":"")+'" data-act="sheet-cur" data-v="KRW">원 (KRW)</button></div>'
    +'<div class="amtrow"><span class="cur">'+curSym+'</span><input id="amtInput" inputmode="numeric" autocomplete="off" value="'+esc(draft.amt)+'" aria-label="금액"></div>'
    +'<div class="flabel">분류</div><div class="chiprow">'
    +EXP_CATS.map(function(c){ return '<button class="chip sm'+(draft.cat===c?" on":"")+'" data-act="sheet-cat" data-v="'+c+'">'+c+'</button>'; }).join("")
    +'</div>'
    +'<div class="flabel">결제</div><div class="chiprow">'
    +PAYS.map(function(p){ return '<button class="chip sm'+(draft.pay===p?" on":"")+'" data-act="sheet-pay" data-v="'+p+'">'+p+'</button>'; }).join("")
    +'</div>'
    +'<div class="flabel">날짜</div><div class="chiprow">'+dayChips+'</div>'
    +'<div class="flabel">내용</div><input class="input" id="noteInput" type="text" autocomplete="off" value="'+esc(draft.note)+'" placeholder="예: 스시 돈부리 점심">'
    +'<button class="savebtn" data-act="quick-save">저장</button>'
    +(draft.editId?'<button class="delbtn" data-act="exp-del-sheet">이 지출 삭제</button>':"");
  var a=document.getElementById("amtInput");
  if(a) a.addEventListener("input", function(){ draft.amt=this.value; });
  var n=document.getElementById("noteInput");
  if(n) n.addEventListener("input", function(){ draft.note=this.value; });
}
function refreshSheetChips(){
  var el=document.getElementById("sheet");
  el.querySelectorAll('[data-act="sheet-cur"]').forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-v")===draft.cur); });
  el.querySelectorAll('[data-act="sheet-cat"]').forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-v")===draft.cat); });
  el.querySelectorAll('[data-act="sheet-pay"]').forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-v")===draft.pay); });
  el.querySelectorAll('[data-act="sheet-day"]').forEach(function(b){ b.classList.toggle("on", +b.getAttribute("data-v")===draft.day); });
  var s=el.querySelector(".amtrow .cur");
  if(s) s.textContent = draft.cur==="JPY" ? "¥" : "₩";
}
function saveExpense(){
  var digits=String(draft.amt).replace(/[^0-9]/g,"");
  var amt=parseInt(digits,10);
  if(!amt || amt<=0){ toast("금액을 넣어 주세요"); return; }
  if(draft.editId){
    var e=getExp(draft.editId);
    if(e){ e.cur=draft.cur; e.amount=amt; e.cat=draft.cat; e.pay=draft.pay; e.day=draft.day; e.note=draft.note; }
  } else {
    state.expenses.push({
      id:"e"+Date.now()+Math.floor(Math.random()*1000),
      cur:draft.cur, amount:amt, cat:draft.cat, pay:draft.pay, day:draft.day, note:draft.note
    });
  }
  state.lastPay={cur:draft.cur, pay:draft.pay};
  save();
  closeSheet();
  render();
  toast("기록했어요 · "+draft.cat+" "+(draft.cur==="JPY"?jpy(amt):won(amt)));
}
</script>
<script>
"use strict";
/* ================= 화면 1 (여행 정보 입력) ================= */
var STEP_NAMES = ["어디로","언제","예약","취향"];
var MOODS = ["온천","도시","자연","미식","쇼핑","바다"];
var MEALS = ["조식 포함","조식 미포함","모름"];
var HOTELPAYS = ["카드","현금","모름"];
var PHONES = ["아이폰","안드로이드"];
var AVOIDS = ["단체 관광객 많은 곳","이른 기상","긴 도보","매운 음식","긴 줄","야간 이동"];

function chipHTML(act, group, value, on, extra){
  return '<button class="chip'+(on?" on":"")+'" data-act="'+act+'"'+(group?' data-group="'+group+'"':"")+' data-v="'+esc(value)+'" aria-pressed="'+(on?"true":"false")+'">'+esc(value)+'</button>';
}
function renderForm(){
  var t=state.trip;
  document.getElementById("stepdots").innerHTML = STEP_NAMES.map(function(n,i){
    var num=i+1, cls = num===state.editStep?"now":(num<state.editStep?"done":"");
    return '<div class="stepdot '+cls+'"><div class="c">'+num+'</div><div class="n">'+n+'</div></div>';
  }).join("");

  document.getElementById("destChips").innerHTML = ["삿포로","미정"].map(function(v){
    return chipHTML("s1-dest","",v,t.dest===v);
  }).join("");
  var moodWrap=document.getElementById("moodWrap");
  moodWrap.style.display = t.dest==="미정" ? "block" : "none";
  document.getElementById("moodChips").innerHTML = MOODS.map(function(v){
    return chipHTML("s1-chip","mood",v,(t.mood||[]).indexOf(v)>=0).replace('class="chip','class="chip');
  }).join("");
  document.getElementById("mealChips").innerHTML = MEALS.map(function(v){ return chipHTML("s1-chip","meal",v,t.meals===v); }).join("");
  document.getElementById("payChips").innerHTML = HOTELPAYS.map(function(v){ return chipHTML("s1-chip","hotelpay",v,t.hotelPay===v); }).join("");
  document.getElementById("phoneChips").innerHTML = PHONES.map(function(v){ return chipHTML("s1-chip","phone",v,t.phone===v); }).join("");
  document.getElementById("avoidChips").innerHTML = AVOIDS.map(function(v){ return chipHTML("s1-chip","avoid",v,(t.avoid||[]).indexOf(v)>=0); }).join("");

  document.getElementById("f_airport").value = t.airport||"";
  document.getElementById("f_start").value = t.start||"";
  document.getElementById("f_end").value = t.end||"";
  document.getElementById("f_people").value = t.people||2;
  document.getElementById("f_budget").value = t.perPerson||"";
  document.getElementById("f_flight").value = t.flight||"";
  document.getElementById("f_hotel").value = t.hotel||"";
  document.getElementById("f_pass").value = t.pass||"";
  document.getElementById("f_benefit").value = t.benefits||"";
  document.getElementById("f_want").value = t.want||"";
  document.getElementById("f_avoidEtc").value = t.avoidEtc||"";

  Array.prototype.forEach.call(document.querySelectorAll(".step"), function(s){
    s.classList.toggle("on", +s.getAttribute("data-step")===state.editStep);
  });
  document.getElementById("err1").classList.remove("on");
  document.getElementById("err2").classList.remove("on");
  document.getElementById("skipBtn").style.display = state.editStep>=3 ? "inline-flex" : "none";
  document.getElementById("nextBtn").textContent = state.editStep>=4 ? "완료" : "다음";
}
function val(id){ var el=document.getElementById(id); return el ? el.value : ""; }
function captureForm(){
  var t=state.trip;
  t.airport=val("f_airport"); t.start=val("f_start"); t.end=val("f_end");
  var p=parseInt(val("f_people"),10); t.people=(p&&p>0)?p:2;
  var b=parseInt(String(val("f_budget")).replace(/[^0-9]/g,""),10); t.perPerson=b||0;
  t.flight=val("f_flight"); t.hotel=val("f_hotel"); t.pass=val("f_pass");
  t.benefits=val("f_benefit"); t.want=val("f_want"); t.avoidEtc=val("f_avoidEtc");
  if(t.dest!=="삿포로" && t.dest!=="미정") t.dest="삿포로";
  if(!Array.isArray(t.mood)) t.mood=[];
  if(!Array.isArray(t.avoid)) t.avoid=[];
}
function daysBetween(a,b){
  try{ return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5)+1; }catch(e){ return 0; }
}
function validateStep(step){
  var t=state.trip;
  if(step===1){
    if(t.dest==="미정" && (!t.mood || t.mood.length===0)){
      document.getElementById("err1").classList.add("on");
      document.getElementById("err1").textContent="여행지를 고르거나, 미정이면 원하는 분위기를 1개 이상 골라 주세요.";
      return false;
    }
    return true;
  }
  if(step===2){
    var err=document.getElementById("err2");
    if(!t.start || !t.end){ err.textContent="시작 날짜와 종료 날짜를 넣어 주세요."; err.classList.add("on"); return false; }
    if(t.end<t.start){ err.textContent="종료 날짜가 시작 날짜보다 빨라요. 날짜를 바꿔 주세요."; err.classList.add("on"); return false; }
    if(daysBetween(t.start,t.end)>21){ err.textContent="한 번에 21일까지만 잡을 수 있어요. 기간을 줄여 주세요."; err.classList.add("on"); return false; }
    if(!t.people || t.people<1){ err.textContent="인원을 1명 이상으로 넣어 주세요."; err.classList.add("on"); return false; }
    return true;
  }
  return true;
}
function formPrev(){
  captureForm();
  if(state.editStep>1){ state.editStep--; save(); render(); window.scrollTo(0,0); }
  else { state.screen="main"; save(); render(); window.scrollTo(0,0); }
}
function formNext(){
  captureForm();
  if(!validateStep(state.editStep)){ return; }
  if(state.editStep<4){ state.editStep++; save(); render(); window.scrollTo(0,0); return; }
  finishForm();
}
function finishForm(){
  captureForm();
  state.screen="main"; state.tab="schedule";
  save(); render(); window.scrollTo(0,0);
  toast("여행 정보를 저장했어요");
}
function toggleFormChip(group,v){
  var t=state.trip;
  if(group==="mood"){
    t.mood=t.mood||[];
    var i=t.mood.indexOf(v);
    if(i>=0) t.mood.splice(i,1);
    else { if(t.mood.length>=3){ toast("분위기는 최대 3개까지 고를 수 있어요"); return; } t.mood.push(v); }
  } else if(group==="avoid"){
    t.avoid=t.avoid||[];
    var j=t.avoid.indexOf(v);
    if(j>=0) t.avoid.splice(j,1); else t.avoid.push(v);
  } else if(group==="meal"){ t.meals=v; }
  else if(group==="hotelpay"){ t.hotelPay=v; }
  else if(group==="phone"){ t.phone=v; }
  captureFormKeepChips();
  save(); render();
}
function captureFormKeepChips(){
  var t=state.trip;
  t.airport=val("f_airport"); t.start=val("f_start"); t.end=val("f_end");
  var p=parseInt(val("f_people"),10); if(p&&p>0) t.people=p;
  var b=parseInt(String(val("f_budget")).replace(/[^0-9]/g,""),10); if(b) t.perPerson=b;
  t.flight=val("f_flight"); t.hotel=val("f_hotel"); t.pass=val("f_pass");
  t.benefits=val("f_benefit"); t.want=val("f_want"); t.avoidEtc=val("f_avoidEtc");
}

/* ================= 홈 목록 조작 ================= */
function toggleItem(kind,id){
  var list=kind==="todo"?state.todo:state.pack;
  for(var i=0;i<list.length;i++){ if(list[i].id===id){ list[i].done=!list[i].done; break; } }
  save(); render();
}
function delItem(kind,id){
  if(kind==="todo") state.todo=state.todo.filter(function(x){ return x.id!==id; });
  else state.pack=state.pack.filter(function(x){ return x.id!==id; });
  save(); render();
}
function addItem(kind,text){
  var t=(text||"").trim();
  if(!t){ toast("내용을 넣어 주세요"); return; }
  var item={id:kind.charAt(0)+Date.now(), text:t, done:false};
  if(kind==="todo") state.todo.push(item); else state.pack.push(item);
  save(); render();
  var el=document.getElementById("add_"+kind);
  if(el) el.focus();
}

/* ================= 지출 삭제 ================= */
var delTimer=null;
function delExpense(id){
  state.expenses=state.expenses.filter(function(e){ return e.id!==id; });
  state.pendingDel=null;
}
function confirmDel(id){
  if(state.pendingDel===id){
    delExpense(id); save(); render(); toast("삭제했어요");
    return;
  }
  state.pendingDel=id; render(); toast("한 번 더 누르면 삭제돼요");
  if(delTimer) clearTimeout(delTimer);
  delTimer=setTimeout(function(){ state.pendingDel=null; render(); }, 5000);
}

/* ================= 복사 ================= */
function fallbackCopy(){
  var box=document.getElementById("summaryBox");
  try{
    var r=document.createRange(); r.selectNodeContents(box);
    var sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  }catch(e){}
  toast("길게 눌러 복사하세요");
}
function copySummary(){
  var txt=summaryText()+"\n\n이 정보로 일정을 확정해서 앱을 업데이트해줘";
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ toast("요약을 복사했어요"); }, function(){ fallbackCopy(); });
      return;
    }
  }catch(e){}
  fallbackCopy();
}

/* ================= 사진 ================= */
function handlePhoto(file){
  if(!file || !/^image\//.test(file.type)){ toast("이미지 파일을 골라 주세요"); return; }
  var reader=new FileReader();
  reader.onerror=function(){ toast("사진을 읽을 수 없어요"); };
  reader.onload=function(){
    var img=new Image();
    img.onerror=function(){ toast("사진을 열 수 없어요"); };
    img.onload=function(){
      try{
        var max=1000, w=img.width||1, h=img.height||1, sc=Math.min(1, max/Math.max(w,h));
        var c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(w*sc)); c.height=Math.max(1,Math.round(h*sc));
        var ctx=c.getContext("2d");
        ctx.drawImage(img,0,0,c.width,c.height);
        var data=c.toDataURL("image/jpeg",0.82);
        if(store.set(PHOTO_KEY, data)){ toast("사진을 저장했어요"); render(); }
        else { toast("이 기기에 사진을 저장하지 못했어요"); }
      }catch(err){ toast("사진을 저장하지 못했어요"); }
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}

/* ================= 탭바 ================= */
var TABS=[
  {id:"schedule", label:"일정", icon:'<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M8 3v4M16 3v4M3.5 10h17M8 14h3M8 17h6"/>'},
  {id:"spots", label:"맛집·관광", icon:'<path d="M7 3v7a2 2 0 0 0 2 2v9M7 3v7M11 3v7"/><path d="M17 3c-1.4 1.8-2 3.6-2 6 0 1.4.6 2.2 2 2.5V21"/>'},
  {id:"home", label:"홈", icon:'<path d="M4 11.2 12 4l8 7.2V20h-5.5v-5.5h-5V20H4z"/>'},
  {id:"lodging", label:"숙소", icon:'<path d="M3 19v-7h18v7M3 12V6"/><path d="M6 12V9.5A1.5 1.5 0 0 1 7.5 8h4A1.5 1.5 0 0 1 13 9.5V12"/><path d="M2.5 19h19"/>'},
  {id:"ledger", label:"가계부", icon:'<rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M16.5 14.5h1.5"/>'}
];

/* ================= 렌더 ================= */
function render(){
  document.getElementById("screen1").classList.toggle("on", state.screen==="form");
  document.getElementById("screen2").classList.toggle("on", state.screen!=="form");
  if(state.screen==="form"){ renderForm(); return; }

  var st=state.trip.start||"", en=state.trip.end||"";
  var lab=(state.trip.destEn||"TRIP")+" · "+st.slice(5).replace("-",".")+" – "+en.slice(5).replace("-",".");
  document.getElementById("topLabel").textContent=lab;
  document.getElementById("topDates").textContent=st.replace(/-/g,".")+" – "+en.slice(5).replace("-",".")+" · "+state.trip.people+"명";

  document.getElementById("tabbar").innerHTML=TABS.map(function(t){
    var on=state.tab===t.id;
    return '<button class="tb'+(on?" on":"")+'" data-act="tab" data-tab="'+t.id+'" aria-current="'+(on?"page":"false")+'">'
      +'<svg viewBox="0 0 24 24" aria-hidden="true">'+t.icon+'</svg>'
      +'<span>'+t.label+'</span></button>';
  }).join("");

  var p=document.getElementById("panel");
  if(state.tab==="schedule") p.innerHTML=scheduleHTML();
  else if(state.tab==="spots") p.innerHTML=spotsHTML();
  else if(state.tab==="home") p.innerHTML=homeHTML();
  else if(state.tab==="lodging") p.innerHTML=lodgingHTML();
  else p.innerHTML=ledgerHTML();

  document.getElementById("fab").classList.toggle("show", state.tab==="ledger" || tripOngoing());
  attachHandlers();
  onScroll();
}

function attachHandlers(){
  var fx=document.getElementById("fxin");
  if(fx){
    fx.addEventListener("input", function(){
      var v=parseInt(String(this.value).replace(/[^0-9]/g,""),10);
      var out=document.getElementById("fxout");
      if(out) out.textContent = v ? won(yen2krw(v)) : "0원";
    });
  }
  var ph=document.getElementById("photoInput");
  if(ph){
    ph.addEventListener("change", function(){
      if(this.files && this.files[0]) handlePhoto(this.files[0]);
    });
  }
  ["todo","pack"].forEach(function(kind){
    var el=document.getElementById("add_"+kind);
    if(el){
      el.addEventListener("keydown", function(e){
        if(e.key==="Enter"){ e.preventDefault(); addItem(kind, this.value); }
      });
    }
  });
}

function onScroll(){
  var els=document.querySelectorAll(".stamps");
  for(var i=0;i<els.length;i++){
    var r=els[i].getBoundingClientRect();
    els[i].classList.toggle("compact", r.top<=1);
  }
}

/* ================= 이벤트 ================= */
document.addEventListener("click", function(ev){
  var el = ev.target && ev.target.closest ? ev.target.closest("[data-act]") : null;
  if(!el) return;
  var act=el.getAttribute("data-act");
  var v=el.getAttribute("data-v");
  var id=el.getAttribute("data-id");
  switch(act){
    case "tab": state.tab=el.getAttribute("data-tab"); save(); render(); window.scrollTo(0,0); break;
    case "day": state.day=parseInt(el.getAttribute("data-day"),10)||1; state.pendingDel=null; save(); render(); break;
    case "toggle-tile":
      var tile=el.getAttribute("data-tile");
      state.openTile=(state.openTile===tile)?"":tile;
      save(); render();
      break;
    case "todo-check": toggleItem("todo",id); break;
    case "pack-check": toggleItem("pack",id); break;
    case "todo-del": delItem("todo",id); break;
    case "pack-del": delItem("pack",id); break;
    case "todo-add": addItem("todo", (document.getElementById("add_todo")||{}).value); break;
    case "pack-add": addItem("pack", (document.getElementById("add_pack")||{}).value); break;
    case "edit-trip": state.screen="form"; state.editStep=1; save(); render(); window.scrollTo(0,0); break;
    case "copy-summary": copySummary(); break;
    case "quick-open": openSheet(null); break;
    case "quick-close": closeSheet(); break;
    case "quick-save": saveExpense(); break;
    case "sheet-cur": draft.cur=v; refreshSheetChips(); break;
    case "sheet-cat": draft.cat=v; refreshSheetChips(); break;
    case "sheet-pay": draft.pay=v; refreshSheetChips(); break;
    case "sheet-day": draft.day=parseInt(v,10)||1; refreshSheetChips(); break;
    case "exp-edit": openSheet(id); break;
    case "exp-del": confirmDel(id); break;
    case "exp-del-sheet": delExpense(draft.editId); save(); closeSheet(); render(); toast("삭제했어요"); break;
    case "s1-dest": captureForm(); state.trip.dest=v; save(); render(); break;
    case "s1-chip": captureFormKeepChips(); toggleFormChip(el.getAttribute("data-group"), v); break;
    case "s1-prev": formPrev(); break;
    case "s1-next": formNext(); break;
    case "s1-skip":
      captureForm();
      if(state.editStep<4){ state.editStep++; save(); render(); window.scrollTo(0,0); }
      else { finishForm(); }
      break;
  }
});

document.addEventListener("keydown", function(ev){
  if(ev.key==="Escape"){
    var w=document.getElementById("sheetwrap");
    if(w && w.classList.contains("open")) closeSheet();
  }
});

window.addEventListener("scroll", onScroll, {passive:true});
window.addEventListener("resize", onScroll);

/* 시작: 열자마자 화면 2(일정 탭, 확정) */
render();
</script>
</body>
</html>
